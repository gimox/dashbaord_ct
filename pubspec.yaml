name: cyberprotrain_admin
description: "Enterprise Desktop Application Template"
publish_to: "none"
version: 1.1.5+9

environment:
  sdk: ">=3.2.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  window_manager: ^0.5.1
  intl: ^0.20.2
  go_router: ^17.2.3
  flutter_riverpod: ^2.6.1
  isar_community: ^3.3.2
  isar_community_flutter_libs: ^3.3.2
  path_provider: ^2.1.5
  universal_io: ^2.2.2
  package_info_plus: ^8.0.0
  excel: ^4.0.6
  archive: ^3.6.1
  file_picker: ^11.0.3
  flutter_widget_from_html: ^0.17.4
  flutter_launcher_icons: ^0.14.4

flutter_launcher_icons:
  android: false # can specify file name here e.g. "ic_launcher"
  ios: false # can specify file name here e.g. "My-Launcher-Icon"
  web:
    generate: false
  windows:
    generate: true
    image_path: "assets/icons/icon-1024.png"
    icon_size: 48 # min:48, max:256, default: 48
  macos:
    generate: true
    image_path: "assets/icons/icon-1024.png"

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0
  build_runner: ^2.4.9
  isar_community_generator: ^3.3.2

flutter:
  uses-material-design: true
  assets:
    - assets/images/
    - assets/report/
