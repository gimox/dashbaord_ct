name: Build & Release Desktop Apps

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  build-macos:
    name: Build macOS App
    runs-on: macos-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Build macOS
        run: flutter build macos --release

      - name: Create DMG package
        run: |
          cd build/macos/Build/Products/Release
          APP_NAME=$(ls -d *.app | head -n 1)
          hdiutil create -format UDZO -srcfolder "$APP_NAME" App_macOS.dmg
          mv App_macOS.dmg ../../../../../App_macOS.dmg

      - name: Upload macOS Artifact
        uses: actions/upload-artifact@v4
        with:
          name: macos-dmg
          path: App_macOS.dmg

  build-windows:
    name: Build Windows App
    runs-on: windows-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Build Windows
        run: flutter build windows --release

      - name: Package Windows (ZIP)
        shell: pwsh
        run: |
          Compress-Archive -Path build\windows\x64\runner\Release\* -DestinationPath App_Windows.zip

      - name: Build Windows Installer (Inno Setup)
        shell: pwsh
        run: |
          $innoPath = "C:\Program Files (x86)\Inno Setup 6"
          if (-not (Get-Command iscc -ErrorAction SilentlyContinue)) {
            if (Test-Path "$innoPath\ISCC.exe") {
              echo "$innoPath" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
              $env:PATH = "$innoPath;$env:PATH"
            } else {
              choco install innosetup -y
              $env:PATH = "$innoPath;$env:PATH"
            }
          }
          iscc /O. /F"App_Windows_Setup" windows/installer/inno_setup.iss
          if ($LASTEXITCODE -ne 0) {
            throw "Compilazione Inno Setup fallita con codice di errore: $LASTEXITCODE"
          }
          if (-not (Test-Path "App_Windows_Setup.exe")) {
            if (Test-Path "windows\installer\App_Windows_Setup.exe") {
              Move-Item "windows\installer\App_Windows_Setup.exe" "App_Windows_Setup.exe"
            } elseif (Test-Path "windows\installer\Output\App_Windows_Setup.exe") {
              Move-Item "windows\installer\Output\App_Windows_Setup.exe" "App_Windows_Setup.exe"
            } else {
              Get-ChildItem -Recurse -Filter "*Setup*.exe"
              throw "App_Windows_Setup.exe non trovato dopo la compilazione Inno Setup!"
            }
          }

      - name: Upload Windows ZIP Artifact
        uses: actions/upload-artifact@v4
        with:
          name: windows-zip
          path: App_Windows.zip
          if-no-files-found: error

      - name: Upload Windows Installer Artifact
        uses: actions/upload-artifact@v4
        with:
          name: windows-installer
          path: App_Windows_Setup.exe
          if-no-files-found: error

  build-linux:
    name: Build Linux App
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Linux build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y clang cmake ninja-build pkg-config libgtk-3-dev liblzma-dev

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Build Linux
        run: flutter build linux --release

      - name: Package Linux (TAR.GZ)
        run: |
          tar -czvf App_Linux.tar.gz -C build/linux/x64/release/bundle .

      - name: Upload Linux Artifact
        uses: actions/upload-artifact@v4
        with:
          name: linux-tar
          path: App_Linux.tar.gz

  create-release:
    name: Create GitHub Release
    needs: [build-macos, build-windows, build-linux]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download macOS Artifact
        uses: actions/download-artifact@v4
        with:
          name: macos-dmg

      - name: Download Windows ZIP Artifact
        uses: actions/download-artifact@v4
        with:
          name: windows-zip

      - name: Download Windows Installer Artifact
        uses: actions/download-artifact@v4
        with:
          name: windows-installer

      - name: Download Linux Artifact
        uses: actions/download-artifact@v4
        with:
          name: linux-tar

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            App_macOS.dmg
            App_Windows.zip
            App_Windows_Setup.exe
            App_Linux.tar.gz
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
